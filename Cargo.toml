[workspace]
resolver = "2"
members = ["ejustice-mcp-core", "ejustice-mcp-local"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Hango Ndeyapo <nnhango@protonmail.com>"]
description = "MCP server for Namibia's public eJustice case search (ejustice.jud.na): search cases, pull grid sections, and fetch documents."
license = "BSD-3-Clause"
repository = "https://github.com/hangonn/ejustice-mcp"
readme = "README.md"
keywords = ["mcp", "ejustice", "namibia", "legal", "scraper"]
categories = ["command-line-utilities", "web-programming::http-client"]
rust-version = "1.96"

[workspace.dependencies]
rmcp = { version = "3.1.2", features = ["server", "macros"] }
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }

[workspace.lints.clippy]
all = { level = "warn" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

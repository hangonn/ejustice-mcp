[package]
name = "ejustice-mcp"
version = "0.1.0"
edition = "2024"
authors = ["Hango Ndeyapo <nnhango@protonmail.com>"]
description = "MCP server for Namibia's public eJustice case search (ejustice.jud.na): search cases, pull grid sections, and fetch documents."
license = "MIT"
repository = "https://github.com/hangonn/ejustice-mcp"
readme = "README.md"
keywords = ["mcp", "ejustice", "namibia", "legal", "scraper"]
categories = ["command-line-utilities", "web-programming::http-client"]
rust-version = "1.88"

[dependencies]
base64 = "0.22"
bytes = "1.12.1"
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53", features = ["full"] }
regex = "1"
reqwest = { version = "0.13", features = [
    "json",
    "cookies",
    "form",
    "hickory-dns",
] }
ego-tree = "0.11.0"
scraper = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
